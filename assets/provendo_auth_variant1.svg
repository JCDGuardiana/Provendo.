  </g>
  <path d="M 300 510 L 300 620" stroke="#F2B441" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
  <g transform="translate(300,650)" stroke="#14468C" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M -22 6 L -22 -19 L 0 -36 L 22 -19 L 22 6 Z"/>
    <line x1="-22" y1="6" x2="22" y2="6" stroke="#F2B441" stroke-width="4"/>
  </g>
  <path d="M 260 420 L 150 420" stroke="#F2B441" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
  <g transform="translate(115,420)" stroke="#14468C" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">

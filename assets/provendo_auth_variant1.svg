  <circle cx="100" cy="300" r="8" fill="#F2B441"/>
  <circle cx="520" cy="820" r="14" fill="#3E8E8C" opacity="0.6"/>

  <!-- central Provendo mark hub -->
  <g transform="translate(300,420)">

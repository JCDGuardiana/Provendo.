<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Padlock and key illustration for resetting a password">
  <!-- soft background -->
  <circle cx="200" cy="205" r="165" fill="#e0e7ff"/>
  <circle cx="200" cy="205" r="125" fill="#c7d2fe" opacity="0.6"/>

  <!-- decorative dots and sparkles -->
  <circle cx="68" cy="110" r="7" fill="#facc15"/>
  <circle cx="338" cy="98" r="5" fill="#1e3a8a" opacity="0.35"/>
  <circle cx="350" cy="290" r="8" fill="#facc15"/>
  <circle cx="52" cy="270" r="5" fill="#1e3a8a" opacity="0.35"/>
  <path d="M312 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#facc15"/>
  <path d="M88 195 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#1e3a8a" opacity="0.5"/>

  <!-- ground shadow -->
  <ellipse cx="200" cy="338" rx="95" ry="12" fill="#1e3a8a" opacity="0.15"/>

  <!-- padlock shackle -->
  <path d="M150 190 V145 a50 50 0 0 1 100 0 V190" fill="none" stroke="#facc15" stroke-width="22" stroke-linecap="round"/>

  <!-- padlock body -->
  <rect x="115" y="180" width="170" height="150" rx="26" fill="#1e3a8a"/>
  <rect x="115" y="180" width="170" height="40" rx="20" fill="#2c4aa8" opacity="0.7"/>

  <!-- keyhole -->
  <circle cx="200" cy="244" r="20" fill="#facc15"/>
  <path d="M192 252 h16 l5 38 h-26z" fill="#facc15"/>

  <!-- key -->
  <g transform="translate(262 292) rotate(-35)">
    <circle cx="0" cy="0" r="24" fill="#facc15" stroke="#1e3a8a" stroke-width="6"/>
    <circle cx="0" cy="0" r="9" fill="#e0e7ff"/>
    <rect x="22" y="-6" width="78" height="12" rx="4" fill="#facc15" stroke="#1e3a8a" stroke-width="5"/>
    <rect x="70" y="4" width="10" height="20" rx="3" fill="#facc15" stroke="#1e3a8a" stroke-width="4"/>
    <rect x="88" y="4" width="10" height="14" rx="3" fill="#facc15" stroke="#1e3a8a" stroke-width="4"/>
  </g>

  <!-- refresh arrow badge -->
  <circle cx="106" cy="110" r="30" fill="#ffffff"/>
  <path d="M120 106 a15 15 0 1 0 -4 10" fill="none" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>
  <path d="M122 92 v16 h-16z" fill="#1e3a8a"/>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="./assets/provendo_icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Boldonse&family=Fragment+Mono:ital@0;1&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Tilt+Neon&family=Tilt+Warp&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./dist/output.css" />
    <title>Sign Up</title>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4 md:p-8">
    <div
      class="card-container rounded-3xl shadow-xl w-full max-w-5xl overflow-hidden flex flex-col md:flex-row p-4 md:p-6 gap-6"
    >
      <div
        class="w-full md:w-1/2 relative rounded-2xl overflow-hidden min-h-[600px]"
      >
        <img
          src="./assets/provendo_signup_image.png"
          alt="signup-img"
          class="absolute inset-0 w-full h-full object-cover"
        />
      </div>

      <div
        class="w-full md:w-1/2 flex flex-col p-4 md:p-6 bg-primary rounded-2xl"
      >
        <div class="title-container text-center p-5">
          <p
            class="font-tilt-warp text-center text-4xl font-bold text-text-tertiary tracking-widest"
          >
            Provendo.
          </p>
        </div>

        <div
          class="form-container flex flex-col justify-center space-y-4 gap-4 md:m-5"
        >
          <form method="POST" class="space-y-4">
            <div
              class="username-field flex flex-col justify-around p-0 gap-3 space-y-1"
            >
              <label for="Email" class="font-open-sans text-md text-white"
                >Username</label
              >
              <div class="relative flex items-center">
                <span class="absolute left-5 top-1/2 -translate-1/2"
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-6"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                    />
                  </svg>
                </span>
                <input
                  type="text"
                  placeholder="Username"
                  required
                  class="w-full border border-white p-2 pl-10 bg-white text-gray rounded-xl font-tilt-neon"
                />
              </div>
            </div>

            <div
              class="password-field flex flex-col justify-around p-0 gap-3 space-y-1"
            >
              <label
                for="password"
                class="text-white font-open-sans text-md text-white"
                >Password</label
              >
              <div class="relative flex items-center text-center">
                <span class="absolute left-5 top-1/2 -translate-1/2"
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-6 text-black"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"
                    />
                  </svg>
                </span>
                <input
                  type="password"
                  placeholder="password"
                  required
                  class="bg-white w-full p-2 rounded-xl pl-10"
                />
                <button
                  id="togglePassword"
                  class="absolute right-2 top-1/2 -translate-1/2 cursor-pointer"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-6"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
                    />
                  </svg>

                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-6 hidden"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="check-box flex items-center gap-4">
              <label
                class="relative flex items-center justify-center cursor-pointer"
              >
                <input type="checkbox" id="privacy" class="sr-only peer" />

                <div
                  class="w-4 h-4 rounded border border-gray-400 bg-white peer-checked:bg-green-600 peer-checked:border-green-600 transition-colors"
                ></div>

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="3"
                  stroke="currentColor"
                  class="w-3 h-3 text-white absolute opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m4.5 12.75 6 6 9-13.5"
                  />
                </svg>
              </label>

              <label
                for="privacy"
                class="text-xs text-gray-300 cursor-pointer select-none"
              >
                I agree to
                <a
                  href="/privacy"
                  class="text-blue-400 underline hover:text-blue-300"
                  >Privacy & Policy</a
                >
              </label>
            </div>

            <button
              type="submit"
              class="cursor-pointer w-full h-5 p-5 flex items-center justify-center rounded-xl text-white bg-blue-600 font-tilt-warp trackign-widest"
            >
              Sign Up
              <span
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-6 ml-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25"
                  />
                </svg>
              </span>
            </button>
          </form>

          <h6 class="text-center font-tilt-warp text-white uppercase">or</h6>

          <div>
            <button
              type="button"
              class="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-100 text-gray-800 font-medium py-2.5 px-4 rounded-xl shadow-sm transition-colors cursor-pointer"
            >
              <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
                <path
                  fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                />
                <path
                  fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                />
                <path
                  fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                />
              </svg>
              <span class="font-tilt-warp">Sign Up with Google</span>
            </button>
          </div>
          <p class="text-center text-white text-sm">
            Already have an account??
            <span><a href="login.html" class="underline">Login</a></span>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
